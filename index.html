<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casa 3D</title>
</head>
<body>
  <div id="app"><div id="labels"></div></div>

  <header>
    <h1>Casa 3D</h1>
    <p>Arrastrar: rotar · Rueda: zoom · Clic derecho: desplazar · Clic: editar material</p>
  </header>

  <nav>
    <button id="btn-iso">Isométrica</button>
    <button id="btn-top">Planta</button>
    <button id="btn-doors" aria-pressed="true">Puertas abiertas</button>
    <button id="btn-labels" aria-pressed="true">Etiquetas</button>
    <button id="btn-furniture" aria-pressed="true">Muebles</button>
  </nav>

  <div id="lighting" class="pill" role="group" aria-label="Iluminación">
    <button data-value="day" aria-pressed="true">Día</button>
    <button data-value="evening" aria-pressed="false">Tarde</button>
    <button data-value="night" aria-pressed="false">Noche</button>
  </div>

  <div id="camera" class="pill" role="group" aria-label="Cámara">
    <button id="cam-zoom-in" aria-label="Acercar" title="Acercar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="cam-zoom-out" aria-label="Alejar" title="Alejar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <hr>
    <button id="cam-left" aria-label="Girar a la izquierda" title="Girar a la izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5"/><path d="M4.6 10A8 8 0 1 1 6 17.3"/></svg></button>
    <button id="cam-right" aria-label="Girar a la derecha" title="Girar a la derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v5h-5"/><path d="M19.4 10A8 8 0 1 0 18 17.3"/></svg></button>
    <button id="cam-up" aria-label="Inclinar hacia arriba" title="Inclinar hacia arriba"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg></button>
    <button id="cam-down" aria-label="Inclinar hacia el horizonte" title="Inclinar hacia el horizonte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10l6 6 6-6"/></svg></button>
    <hr>
    <button id="cam-frame" aria-label="Encuadrar el modelo" title="Encuadrar el modelo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <aside id="editor" aria-label="Editor de materiales" hidden>
    <div class="ed-head">
      <div><small>Material</small><strong id="ed-title"></strong></div>
      <button id="ed-close" aria-label="Cerrar editor">×</button>
    </div>
    <div id="ed-finishes" class="ed-finishes" role="group" aria-label="Acabado"></div>
    <label class="ed-row"><span>Color</span><input type="color" id="ed-color"></label>
    <label class="ed-row"><span>Brillo</span><input type="range" id="ed-gloss" min="0" max="100" step="1"><output id="ed-gloss-out"></output></label>
    <label class="ed-row"><span>Escala</span><input type="range" id="ed-scale" min="25" max="400" step="5"><output id="ed-scale-out"></output></label>
    <button id="ed-reset">Restablecer</button>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
